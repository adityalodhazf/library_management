name: library

services:
  library_server:
    image: library_server
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: postgresql://admin:password12345@postgres:5432/library_mgmt
    networks:
      - library_network
  
  postgres:
    image: postgres:18
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: library_mgmt
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password12345

    ports:
      - "5432:5432"
    
    networks:
      - library_network

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d library_mgmt"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ui:
  #   build:
  #     context: .
  #     dockerfile: ui/Dockerfile

  #   ports:
  #     - "3000:3000"

  #   environment:
  #     GRPC_SERVER: library_server:50051

  #   depends_on:
  #     - library_server

  #   networks:
  #     - library_network

volumes:
  postgres_data:

networks:
  library_network:
    driver: bridge